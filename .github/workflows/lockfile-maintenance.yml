name: Lockfile maintenance

on:
  schedule:
    # Mondays at 18:00 UTC (10am PST / 11am PDT) - after Renovate's weekly
    # "on monday" run for direct dependencies, so this only ever touches
    # transitive dependencies Renovate doesn't open its own PR for.
    - cron: "0 18 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cargo-lockfile:
    name: Refresh Cargo.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: "false"

      - name: Refresh Cargo.lock with a minimum release age guard
        run: python3 .github/scripts/cargo_lockfile_maintenance.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: weekly Cargo.lock maintenance"
          title: "chore: weekly Cargo.lock maintenance"
          body: >
            Automated transitive dependency refresh for `Cargo.lock`.
            Direct dependency bumps are handled separately by Renovate;
            this covers transitive dependencies only, and skips any
            crate version published within the last 20 days to match
            Renovate's `minimumReleaseAge` policy for this repository.
          branch: lockfile-maintenance/cargo
          delete-branch: true
          add-paths: Cargo.lock
