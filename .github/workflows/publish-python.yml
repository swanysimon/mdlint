name: Python

on:
  workflow_call:

jobs:
  publish:
    name: Publish Python wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: python

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mdlint-*
          path: /tmp/binaries
          merge-multiple: true

      - name: Build wheels
        run: |
          set -euo pipefail

          # Read the glibc floor out of the binary rather than hardcoding it, so
          # the wheel tag can never overstate what the binary actually runs on.
          # release-binaries.yml builds in a manylinux container and asserts the
          # floor; this only reports it. The legacy manylinux2014 alias is added
          # when the floor is 2.17, for pip older than 20.3 which predates the
          # PEP 600 tags; above 2.17 no such alias exists.
          glibc_tag() {
            local version arch tag
            arch="$2"
            # `|| true` keeps the guard below reachable: under pipefail a grep
            # that matches nothing would abort the step with no explanation.
            version=$(readelf -V "$1" | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sed 's/GLIBC_//' | sort -uV | tail -1) || true
            [[ -n $version ]] || { echo "no GLIBC version symbols in $1" >&2; exit 1; }
            tag="manylinux_${version//./_}_${arch}"
            [[ $version == "2.17" ]] && tag="${tag}.manylinux2014_${arch}"
            echo "$tag"
          }

          x86_64_tag="$(glibc_tag /tmp/binaries/mdlint-linux-x86_64 x86_64)"
          aarch64_tag="$(glibc_tag /tmp/binaries/mdlint-linux-aarch64 aarch64)"
          echo "derived glibc wheel tags: $x86_64_tag $aarch64_tag"

          declare -A platforms=(
            [mdlint-linux-x86_64]="$x86_64_tag"
            [mdlint-linux-x86_64-musl]="musllinux_1_2_x86_64"
            [mdlint-linux-aarch64]="$aarch64_tag"
            [mdlint-linux-aarch64-musl]="musllinux_1_2_aarch64"
            [mdlint-macos-x86_64]="macosx_10_12_x86_64"
            [mdlint-macos-aarch64]="macosx_11_0_arm64"
            [mdlint-windows-x86_64.exe]="win_amd64"
          )
          for asset in "${!platforms[@]}"; do
            binary="mdlint$([[ $asset == *.exe ]] && echo .exe || echo '')"
            cp "/tmp/binaries/$asset" "mdlint/$binary"
            chmod +x "mdlint/$binary"
            MDLINT_PLATFORM_TAG="${platforms[$asset]}" uv build --wheel
            rm "mdlint/$binary"
          done

      - name: Publish to PyPI
        run: uv publish dist/*.whl
