name: Release Binaries

on:
  workflow_call:
    inputs:
      release:
        description: GitHub release to upload artifacts into
        required: true
        type: string

jobs:
  release:
    name: Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The gnu targets build inside a manylinux image so they link against its
    # old glibc instead of the runner's. That decouples the floor from the
    # runner image, which is what broke in #84: ubuntu-latest moved to 24.04
    # (glibc 2.39) and the binaries stopped running on WSL2 and RHEL 9.
    # manylinux_2_28 is the oldest image that can still run the node24 actions
    # pinned below, so the job needs no in-step Docker plumbing.
    container: ${{ matrix.container }}
    permissions:
      contents: write
    env:
      # Asserted after the build. Must match the container's glibc; covers
      # RHEL 9 (2.34), Ubuntu 22.04 (2.35) and WSL2.
      GLIBC_FLOOR: "2.28"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4
            target: x86_64-unknown-linux-gnu
            artifact_name: mdlint
            asset_name: mdlint-linux-x86_64
            archive_format: tar.gz

          # Linux x86_64 (musl - static binary)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: mdlint
            asset_name: mdlint-linux-x86_64-musl
            archive_format: tar.gz

          # Linux aarch64
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:bbb43f784ce78a454a9e3351b862a12e7ad5c30972e8aeba092da678918bbba9
            target: aarch64-unknown-linux-gnu
            artifact_name: mdlint
            asset_name: mdlint-linux-aarch64
            archive_format: tar.gz

          # Linux aarch64 (musl - static binary)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact_name: mdlint
            asset_name: mdlint-linux-aarch64-musl
            archive_format: tar.gz

          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: mdlint
            asset_name: mdlint-macos-x86_64
            archive_format: tar.gz

          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: mdlint
            asset_name: mdlint-macos-aarch64
            archive_format: tar.gz

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mdlint.exe
            asset_name: mdlint-windows-x86_64.exe
            archive_format: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2
        with:
          target: ${{ matrix.target }}
          cache-key: "release"
          cache-shared-key: ${{ matrix.target }}

      - name: Install musl tools (Linux musl only)
        if: ${{ contains(matrix.target, 'musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The manylinux images are AlmaLinux 8 and package no gh, which the
      # upload step below needs. Every other runner image ships it.
      - name: Install GitHub CLI (container only)
        if: ${{ matrix.container != '' }}
        env:
          GH_VERSION: "2.83.0"
          GH_ARCH: ${{ startsWith(matrix.target, 'aarch64') && 'arm64' || 'amd64' }}
        run: |
          set -euo pipefail
          archive="gh_${GH_VERSION}_linux_${GH_ARCH}"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${archive}.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/${archive}/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # The container sets the floor; this proves it landed, so a base-image
      # bump that raises glibc fails before any artifact is uploaded rather
      # than shipping. npm and the raw tarballs have no wheel-tag mechanism,
      # so every consumer depends on this check. See issue #84.
      - name: Verify glibc floor (Linux gnu only)
        if: ${{ endsWith(matrix.target, '-linux-gnu') }}
        env:
          BINARY: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          # `|| true` keeps the check below reachable: under pipefail a grep
          # that matches nothing would abort the step with no explanation.
          version=$(readelf -V "$BINARY" | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sed 's/GLIBC_//' | sort -uV | tail -1) || true
          [[ -n $version ]] || { echo "::error::no GLIBC version symbols in $BINARY" >&2; exit 1; }
          echo "$BINARY requires glibc $version (floor $GLIBC_FLOOR)"
          if [[ "$(printf '%s\n' "$GLIBC_FLOOR" "$version" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]]; then
            echo "::error::glibc $version exceeds the $GLIBC_FLOOR floor; this binary would not run on RHEL 9 or WSL2." >&2
            echo "The container base image likely moved; pin an older manylinux image or raise GLIBC_FLOOR to drop those systems." >&2
            exit 1
          fi
          # A non-numeric marker such as GLIBC_ABI_DT_RELR raises the real
          # requirement without adding a versioned symbol the check above sees.
          # GLIBC_PRIVATE is excluded: it versions glibc-internal symbols and
          # says nothing about the floor, so matching it would fail the release
          # with a misleading message.
          if readelf -V "$BINARY" | grep -o 'GLIBC_[A-Z_][A-Za-z_]*' | grep -v '^GLIBC_PRIVATE$'; then
            echo "::error::unversioned GLIBC ABI marker found; it raises the floor above $GLIBC_FLOOR." >&2
            exit 1
          fi

      - name: Package release (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        working-directory: target/${{ matrix.target }}/release
        run: |
          strip ${{ matrix.artifact_name }}

          # Copy binary with asset name
          cp ${{ matrix.artifact_name }} ${{ matrix.asset_name }}

          # Generate checksums
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

          # Create tarball with checksum
          tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Package release (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        working-directory: target/${{ matrix.target }}/release
        run: |
          # Copy binary with asset name
          Copy-Item -Path ${{ matrix.artifact_name }} -Destination ${{ matrix.asset_name }}

          # Generate checksums
          $hash = (Get-FileHash ${{ matrix.asset_name }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -Encoding ASCII ${{ matrix.asset_name }}.sha256

          # Create zip with checksum
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}.zip
          $hash = (Get-FileHash ${{ matrix.asset_name }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}.zip" | Out-File -Encoding ASCII ${{ matrix.asset_name }}.zip.sha256

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: target/${{ matrix.target }}/release
        shell: bash
        run: |
          gh release upload ${{ inputs.release }} \
            ${{ matrix.asset_name }} \
            ${{ matrix.asset_name }}.sha256 \
            ${{ matrix.asset_name }}.${{ matrix.archive_format }} \
            ${{ matrix.asset_name }}.${{ matrix.archive_format }}.sha256 \
            --clobber \
            --repo ${{ github.repository }}

      - name: Upload binary artifact for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          retention-days: 3
