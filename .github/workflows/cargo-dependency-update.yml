name: Cargo dependency update

on:
  schedule:
    # Mondays at 18:00 UTC (10am PST / 11am PDT).
    - cron: "0 18 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cargo-update:
    name: Update Cargo dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: "false"

      - name: Update Cargo dependencies with a minimum release age guard
        run: python3 .github/scripts/cargo_dependency_update.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: weekly Cargo dependency update"
          title: "chore: weekly Cargo dependency update"
          body: >
            Automated `cargo update`, covering both in-range direct
            dependency bumps and transitive dependency updates in a single
            commit. Skips any crate version published within the last 20
            days, matching this repository's `minimumReleaseAge` policy.
            Renovate no longer manages the cargo manager (see
            `renovate.json`); it continues to handle mise tools, the Rust
            toolchain, GitHub Actions, and the Dockerfile.

            Note: this only covers in-range updates. A breaking/major
            version bump for a direct dependency requires editing
            `Cargo.toml`'s version requirement by hand.
          branch: cargo-dependency-update
          delete-branch: true
          add-paths: Cargo.lock
