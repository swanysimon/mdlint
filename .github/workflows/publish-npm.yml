name: npm

on:
  workflow_call:

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          sparse-checkout: npm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 'lts/*'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mdlint-*
          path: /tmp/binaries
          merge-multiple: true

      - name: Stage binaries
        working-directory: npm/bin
        run: |
          mv /tmp/binaries/mdlint-linux-x86_64       mdlint-linux-x64
          mv /tmp/binaries/mdlint-linux-x86_64-musl  mdlint-linux-x64-musl
          mv /tmp/binaries/mdlint-linux-aarch64      mdlint-linux-arm64
          mv /tmp/binaries/mdlint-linux-aarch64-musl mdlint-linux-arm64-musl
          mv /tmp/binaries/mdlint-macos-x86_64       mdlint-darwin-x64
          mv /tmp/binaries/mdlint-macos-aarch64      mdlint-darwin-arm64
          mv /tmp/binaries/mdlint-windows-x86_64.exe mdlint-win32-x64.exe
          chmod +x mdlint-*

      - name: Publish to npm
        run: npm publish --access public --provenance
