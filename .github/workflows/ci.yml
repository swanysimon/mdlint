name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  check-code:
    name: Check codebase
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache-key: "lint"

      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - name: Run formatters and linters
        # -v keeps output from hooks that pass; --show-diff-on-failure prints what each
        # file-rewriting hook (cargo fmt, tombi, clippy --fix, dogfood format) changed
        run: prek run -av --show-diff-on-failure

      - name: Run tests
        run: mise run test

  check-npm:
    name: Verify npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: npm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Check syntax
        run: node --check bin/mdlint.js

      - name: Check package
        run: npm pack --dry-run

  check-python:
    name: Verify Python package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: python

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check syntax
        run: uv run python -m py_compile mdlint/__init__.py mdlint/__main__.py

      - name: Build wheel
        run: uv build --wheel

      - name: Check package metadata
        run: uvx twine check dist/*.whl
