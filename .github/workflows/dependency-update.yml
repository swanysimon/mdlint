name: Dependency update

on:
  schedule:
    # Mondays at 18:00 UTC (10am PST / 11am PDT), matching renovate.json's
    # own "on monday" schedule (timezone America/Los_Angeles).
    - cron: "0 18 * * 1"
  workflow_dispatch: {}

# Renovate authenticates with RENOVATE_TOKEN, never GITHUB_TOKEN, so the
# automatic token needs no permissions at all.
permissions: {}

jobs:
  update:
    name: Update dependencies
    runs-on: ubuntu-latest
    steps:
      # Everything happens inside the Renovate container: it clones the
      # repository itself and installs whatever toolchain a lockfile update
      # needs. The runner's workspace and PATH are not mounted into it, so
      # there is nothing useful to check out or install here.
      #
      # lockFileMaintenance would always land in its own branch and PR,
      # which cannot be merged into the regular update PR (hardcoded in
      # Renovate: lib/workers/repository/updates/branch-name.ts). It is
      # disabled in renovate.json in favour of a postUpgradeTasks
      # `cargo update`, which refreshes transitive dependencies inside the
      # regular update branch instead. allowedCommands is the allowlist
      # that permits it; it is global-only config, so it lives here rather
      # than in renovate.json, and must stay in sync with that command.
      - name: Run self-hosted Renovate
        uses: renovatebot/github-action@37beffda261423addd537c33f2d126df7f6ffbab # v46.2.6
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^cargo update$"]'
