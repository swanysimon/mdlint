[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
priority = 1

[[repos.hooks]]
id = "end-of-file-fixer"
priority = 2

[[repos]]
repo = "local"

[[repos.hooks]]
id = "format-toml"
name = "format toml"
entry = "mise run format:toml"
language = "system"
pass_filenames = false
types = ["toml"]
priority = 3

[[repos.hooks]]
id = "format-rust"
name = "format rust"
entry = "mise run format:rust"
language = "system"
pass_filenames = false
types = ["rust"]
priority = 3

[[repos.hooks]]
id = "lint-rust"
name = "clippy (autofix)"
entry = "mise run lint:rust --fix"
language = "system"
pass_filenames = false
types = ["rust"]
priority = 4

[[repos.hooks]]
id = "lint-workflows"
name = "check workflows"
entry = "mise run lint:workflows"
language = "system"
types = ["yaml"]
files = "^\\.github/workflows/"
priority = 4

[[repos.hooks]]
id = "lint-dockerfile"
name = "check dockerfile"
entry = "mise run lint:dockerfile"
language = "system"
files = "^Dockerfile$"
priority = 4

[[repos.hooks]]
id = "lint-shell"
name = "check shell scripts"
entry = "mise run lint:shell"
language = "system"
types = ["shell"]
priority = 4

[[repos.hooks]]
id = "lint-toml"
name = "check toml"
entry = "mise run lint:toml"
language = "system"
pass_filenames = false
types = ["toml"]
priority = 4

[[repos.hooks]]
id = "format-markdown"
name = "format markdown (dogfood)"
entry = "mise run format:markdown"
language = "system"
pass_filenames = false
types_or = ["markdown", "rust"]
priority = 5

[[repos.hooks]]
id = "lint-markdown"
name = "check markdown (dogfood)"
entry = "mise run lint:markdown"
language = "system"
pass_filenames = false
types_or = ["markdown", "rust"]
priority = 6
