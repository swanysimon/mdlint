[package]
name = "markdownlint-rs"
version = "0.3.23"
edition = "2024"
description = "A fast, flexible, configuration-based command-line interface for linting Markdown/CommonMark files"
repository = "https://github.com/swanysimon/mdlint"
license = "Unlicense"
keywords = ["cli", "formatter", "lint", "markdown"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mdlint"
path = "src/lib.rs"

[[bin]]
name = "mdlint"
path = "src/main.rs"

[dependencies]
clap = { version = "^4.6.4", features = ["derive"] }
globset = ">= 0.4.19, < 1"
ignore = ">= 0.4.31, < 1"
lsp-server = ">= 0.10.0, < 1"
lsp-types = ">= 0.97, < 1"
pulldown-cmark = ">= 0.13.4, < 1"
rayon = "^1.12.0"
regex = "^1.13.1"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
thiserror = "^2.0.19"
toml = "^1.1.4"
url = "^2.5.8"
yaml_serde = "^0.10.4"

[dev-dependencies]
indoc = "^2.0.7"
proptest = "^1.11.0"
tempfile = "^3.27.0"

# Groups denied: all, pedantic (priority 0)
# Opt-in restriction lints (priority 1, deny): cast_possible_truncation, implicit_hasher,
#   mutable_key_type, similar_names, struct_excessive_bools, too_many_lines
# Pedantic suppressed (priority 1, allow): missing_errors_doc, missing_panics_doc (no doc
#   culture), module_name_repetitions (LintEngine in lint module is clearer),
#   non_ascii_literal (Unicode punctuation sets are intentional),
#   wildcard_enum_match_arm (conflicts with match_same_arms)
# lint_groups_priority suppressed: we intentionally mix group and individual priorities
[lints.clippy]
all = "deny"
cast_possible_truncation = { level = "deny", priority = 1 }
implicit_hasher = { level = "deny", priority = 1 }
lint_groups_priority = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
mutable_key_type = { level = "deny", priority = 1 }
non_ascii_literal = { level = "allow", priority = 1 }
pedantic = "deny"
similar_names = { level = "deny", priority = 1 }
struct_excessive_bools = { level = "deny", priority = 1 }
too_many_lines = { level = "deny", priority = 1 }
wildcard_enum_match_arm = { level = "allow", priority = 1 }

[lints.rust]
warnings = "deny"

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
